openapi: 3.0.3
info:
  title: Formatter statistics API
  version: 1.0.0
  description: Process-local counters for hook calls, rule executions and consumed hello.Greeted events. Counters reset when this instance restarts.
paths:
  /formatter/:
    get:
      operationId: getStatistics
      summary: Read formatter statistics
      description: Returns a snapshot from the instance selected by the gateway. This is not a cluster-wide aggregate.
      responses:
        '200':
          description: Current instance statistics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Statistics'
              example:
                formatted: 3
                recorded: 3
                observed: 3
                last_text: Welcome, Developer!
components:
  schemas:
    Statistics:
      type: object
      description: An atomic snapshot of this instance's counters.
      required: [formatted, recorded, observed, last_text]
      properties:
        formatted:
          type: integer
          format: uint64
          minimum: 0
          description: Successful Format activity calls.
        recorded:
          type: integer
          format: uint64
          minimum: 0
          description: Record activity calls accepted after deduplication against the most recent 4096 keys.
        observed:
          type: integer
          format: uint64
          minimum: 0
          description: hello.Greeted events accepted after deduplication against the most recent 4096 keys.
        last_text:
          type: string
          description: Most recently recorded or observed greeting; empty before the first greeting.

openapi: 3.0.3
info:
  title: Legacy listener example API
  version: 1.0.0
  description: A fixed text response served by hello.
paths:
  /legacy/:
    get:
      operationId: readLegacyMessage
      summary: Read the listener message
      responses:
        '200':
          description: The fixed message, followed by a newline.
          content:
            text/plain:
              schema:
                type: string
              example: "served by hello's own listener\n"

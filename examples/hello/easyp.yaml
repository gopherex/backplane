# Code generation for the hello example: gRPC stubs.
lint:
  use:
    - DEFAULT
  service_suffix: Service
  allow_comment_ignores: false
  except:
    - PACKAGE_DIRECTORY_MATCH
generate:
  inputs:
    - directory: proto
  plugins:
    - name: go
      out: .
      opts:
        paths: source_relative
    - name: go-grpc
      out: .
      opts:
        paths: source_relative

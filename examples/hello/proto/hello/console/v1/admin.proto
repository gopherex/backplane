syntax = "proto3";

package hello.console.v1;

option go_package = "github.com/gopherex/backplane/examples/hello/proto/hello/console/v1;helloconsolev1";

// Internal API of hello: for its console plugin only, via the relay.
service AdminService {
  rpc GetStats(GetStatsRequest) returns (GetStatsResponse);
}

message GetStatsRequest {}

message GetStatsResponse {
  uint64 greetings = 1;
  string current_greeting = 2;
}

syntax = "proto3";

package backplane.console.v1;

import "backplanepb/console/v1/calls.proto";
import "backplanepb/console/v1/workflows.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/gopherex/backplane/backplanepb/console/v1;consolev1";

// BindingService is the console's view of bindings (§7.1): the
// implementation of a hook ("<service>.<Hook>") assembled from activities
// of other services, kept as versions in PostgreSQL. A save validates the
// definition against the latest manifests (the hook, every activity, CEL
// type-checked by the schemas); a delete is a tombstone version, so the
// history stays.
//
// Runs belong to the executor (internal/executor) and come as their own
// RPCs next to these: TestBinding, ListBindingRuns, GetBindingRun,
// CancelBindingRun. A run is the workflow backplane.Binding.v1 on
// backplane's task queue: id binding/<hook>/<Nexus request id> for a hook
// call, test/<hook>/<uuid> for a test.
service BindingService {
  // ListBindings is every hook of the installation with its binding state,
  // and every binding whose hook no manifest declares any more.
  rpc ListBindings(ListBindingsRequest) returns (ListBindingsResponse);
  // GetBinding is one version of a hook's binding: the current one by
  // default.
  rpc GetBinding(GetBindingRequest) returns (GetBindingResponse);
  // ListBindingVersions pages through a hook's versions, newest first.
  rpc ListBindingVersions(ListBindingVersionsRequest) returns (ListBindingVersionsResponse);
  // ValidateBinding is SaveBinding without saving: the violations it would
  // be rejected with.
  rpc ValidateBinding(ValidateBindingRequest) returns (ValidateBindingResponse);
  // SaveBinding validates the definition and, when valid, saves it as the
  // next version of its hook's binding. Invalid: nothing is saved,
  // violations say why.
  rpc SaveBinding(SaveBindingRequest) returns (SaveBindingResponse);
  // RollbackBinding saves a new version with the definition of an older
  // one (rollback_of), validated as any save.
  rpc RollbackBinding(RollbackBindingRequest) returns (RollbackBindingResponse);
  // DeleteBinding saves a tombstone version: the hook becomes unbound, the
  // history stays.
  rpc DeleteBinding(DeleteBindingRequest) returns (DeleteBindingResponse);
  // ParseBinding reads the text form of a binding (§7.1).
  rpc ParseBinding(ParseBindingRequest) returns (ParseBindingResponse);
  // FormatBinding writes the text form of a definition; ParseBinding reads
  // it back into the same definition.
  rpc FormatBinding(FormatBindingRequest) returns (FormatBindingResponse);
  // WatchBindings streams ListBindings: now, then again whenever it
  // changes (a save on any replica, a manifest).
  rpc WatchBindings(WatchBindingsRequest) returns (stream WatchBindingsResponse);

  // TestBinding runs a binding on a sample input — the current version, an
  // older one, or an unsaved definition compiled against the latest
  // manifests — as the workflow a hook call runs (id
  // test/<hook>/<uuid>), and waits for its end.
  rpc TestBinding(TestBindingRequest) returns (TestBindingResponse);
  // ListBindingRuns is a hook's runs, newest first (Temporal visibility,
  // workflow id prefix binding/<hook>/ or test/<hook>/).
  rpc ListBindingRuns(ListBindingRunsRequest) returns (ListBindingRunsResponse);
  // GetBindingRun is one run: status, input, result or failure, history,
  // and the steps' timeline.
  rpc GetBindingRun(GetBindingRunRequest) returns (GetBindingRunResponse);
  // CancelBindingRun requests cancellation of a run: steps in flight are
  // canceled, completed ones compensated (undo), the run ends canceled.
  rpc CancelBindingRun(CancelBindingRunRequest) returns (CancelBindingRunResponse);
}

// BindingDefinition is what a binding says: the hook it implements, the
// steps, and the hook's output.
message BindingDefinition {
  // Full hook name "<service>.<Hook>".
  string hook = 1;
  // In declaration order; the order of execution follows dependencies.
  repeated BindingStep steps = 2;
  // The hook's output, CEL over `req` and the steps; empty: {}.
  BindingValue result = 3;
}

// BindingStep is one call of an activity.
message BindingStep {
  // Identifier, unique in the definition; the step's output is a CEL
  // variable of this name.
  string name = 1;
  // Full activity name "<service>.<Activity>".
  string activity = 2;
  // The activity's input; empty: {}.
  BindingValue input = 3;
  // CEL bool: the step runs only when true; empty: always.
  string when = 4;
  // Steps this one runs after besides those its expressions reference.
  repeated string after = 5;
  // Compensation: full activity name run when a later step fails (saga);
  // empty: none.
  string undo = 6;
  // The undo activity's input; empty: the step's output.
  BindingValue undo_input = 7;
  // Unset fields take the activity's manifest defaults, then the
  // platform's.
  BindingRetry retry = 8;
  // One attempt (one run of a workflow activity); unset: the activity's
  // default, then the platform's.
  google.protobuf.Duration start_to_close = 9;
  // An attempt without a heartbeat this long is lost; unset: the
  // activity's default, else none.
  google.protobuf.Duration heartbeat = 10;
}

// BindingValue is a value built by CEL: either named fields, each from an
// expression (an object), or one expression for the whole value. Neither:
// the default of its place.
message BindingValue {
  repeated BindingField fields = 1;
  // CEL expression; exclusive with fields.
  string expr = 2;
}

// BindingField is one field of an object built by CEL.
message BindingField {
  // JSON field name.
  string name = 1;
  // CEL expression of its value.
  string expr = 2;
}

// BindingRetry is the retry policy of a step; zero fields are unset.
message BindingRetry {
  // Attempts in total, the first included.
  uint32 attempts = 1;
  google.protobuf.Duration initial_interval = 2;
  google.protobuf.Duration max_interval = 3;
  // Multiplier of the interval after each attempt (>= 1).
  double backoff = 4;
}

// BindingVersion is one saved version of a hook's binding.
message BindingVersion {
  string hook = 1;
  // Counts from 1 per hook.
  uint64 version = 2;
  // Absent on a tombstone.
  BindingDefinition definition = 3;
  // A tombstone: the delete of the binding.
  bool deleted = 4;
  string author = 5;
  string comment = 6;
  google.protobuf.Timestamp created_at = 7;
  // The version this one rolls back to; 0 when it is not a rollback.
  uint64 rollback_of = 8;
}

// BindingState is whether a hook is answered.
enum BindingState {
  BINDING_STATE_UNSPECIFIED = 0;
  // The current version is a definition.
  BINDING_STATE_BOUND = 1;
  // No binding (never saved or deleted); calls get the default output.
  BINDING_STATE_UNBOUND = 2;
  // No binding and the hook is required: calls fail with "no binding".
  BINDING_STATE_REQUIRED_UNBOUND = 3;
}

// HookBinding is a hook and its binding, as ListBindings shows it.
message HookBinding {
  // Full hook name.
  string hook = 1;
  string service = 2;
  // Declared by the service's latest manifest; false: only the binding is
  // left of a hook the service dropped.
  bool declared = 3;
  bool required = 4;
  string description = 5;
  BindingState state = 6;
  // Current version; absent before the first save.
  BindingVersion current = 7;
}

// BindingViolation is one reason a definition is rejected.
message BindingViolation {
  // Place in the definition: "hook", "steps[1].input.to", "result",
  // "steps[0].retry.attempts"; empty for the whole definition.
  string path = 1;
  // Machine code: INVALID_NAME, RESERVED_NAME, DUPLICATE_STEP,
  // UNKNOWN_HOOK, UNKNOWN_EVENT, UNKNOWN_ACTIVITY, UNKNOWN_STEP, CYCLE,
  // UNDO_REFERENCE, CEL_ERROR, TYPE_MISMATCH, MISSING_FIELD, UNKNOWN_FIELD,
  // DUPLICATE_FIELD, INVALID_VALUE, INVALID_OPTION.
  string code = 2;
  string message = 3;
}

// BindingParseError is where the text form does not read.
message BindingParseError {
  // From 1; 0 when the error is not tied to a place.
  uint32 line = 1;
  // From 1, in characters.
  uint32 column = 2;
  string message = 3;
}

message ListBindingsRequest {
  // Only hooks of this service; empty: all.
  string service = 1;
}

message ListBindingsResponse {
  // By hook name.
  repeated HookBinding bindings = 1;
}

message GetBindingRequest {
  string hook = 1;
  // 0: the current version.
  uint64 version = 2;
}

message GetBindingResponse {
  BindingVersion version = 1;
}

message ListBindingVersionsRequest {
  string hook = 1;
  // Versions below this one; 0: from the newest.
  uint64 before = 2;
  // At most this many (default 50, at most 500).
  uint32 page_size = 3;
}

message ListBindingVersionsResponse {
  repeated BindingVersion versions = 1;
  // `before` of the next page; 0 when this is the last one.
  uint64 next_before = 2;
}

message ValidateBindingRequest {
  BindingDefinition definition = 1;
}

message ValidateBindingResponse {
  // Empty: the definition is valid.
  repeated BindingViolation violations = 1;
}

message SaveBindingRequest {
  BindingDefinition definition = 1;
  string comment = 2;
}

message SaveBindingResponse {
  // The saved version; absent when the definition is rejected.
  BindingVersion version = 1;
  // Why the definition is rejected; empty when saved.
  repeated BindingViolation violations = 2;
}

message RollbackBindingRequest {
  string hook = 1;
  // The version whose definition becomes the new version.
  uint64 version = 2;
  string comment = 3;
}

message RollbackBindingResponse {
  // The saved version; absent when the definition is rejected.
  BindingVersion version = 1;
  // Why the definition is rejected now (manifests may have changed since);
  // empty when saved.
  repeated BindingViolation violations = 2;
}

message DeleteBindingRequest {
  string hook = 1;
  string comment = 2;
}

message DeleteBindingResponse {
  // The tombstone.
  BindingVersion version = 1;
}

message ParseBindingRequest {
  string text = 1;
}

message ParseBindingResponse {
  // Absent when the text does not read.
  BindingDefinition definition = 1;
  repeated BindingParseError errors = 2;
}

message FormatBindingRequest {
  BindingDefinition definition = 1;
}

message FormatBindingResponse {
  string text = 1;
}

message WatchBindingsRequest {
  // Only hooks of this service; empty: all.
  string service = 1;
}

message WatchBindingsResponse {
  repeated HookBinding bindings = 1;
}

// ---- runs -------------------------------------------------------------------

message TestBindingRequest {
  // Full hook name; with a definition it may be empty (the definition's).
  string hook = 1;
  // The hook's input (`req`): JSON text; empty is {}.
  string input = 2;
  // Version of the saved binding; 0: the current one. Exclusive with
  // definition.
  uint64 version = 3;
  // An unsaved definition, validated and compiled against the latest
  // manifests; exclusive with version.
  BindingDefinition definition = 4;
  // How long to wait for the run (its execution timeout); zero: 30s, at
  // most 10 minutes.
  google.protobuf.Duration timeout = 5;
}

message TestBindingResponse {
  // Violations of the definition (or of the saved version against today's
  // manifests); when present nothing ran.
  repeated BindingViolation violations = 1;
  // The run's end: output (the hook's result) or the error ("step send:
  // smtp.Send: ...", "transform failed at ..."). Absent with violations.
  CallResult result = 2;
  // The version that ran; 0 for an unsaved definition.
  uint64 version = 3;
}

message ListBindingRunsRequest {
  string hook = 1;
  // Only this status.
  RunStatus status = 2;
  // Test runs (test/<hook>/) instead of the hook calls (binding/<hook>/).
  bool tests = 3;
  // At most this many (default 50, at most 500).
  uint32 page_size = 4;
  // From the previous response; empty: the first page.
  bytes page_token = 5;
}

message ListBindingRunsResponse {
  repeated Run runs = 1;
  // Empty on the last page.
  bytes next_page_token = 2;
  // The visibility query that was run.
  string query = 3;
}

message GetBindingRunRequest {
  // A run of a binding: binding/<hook>/... or test/<hook>/...
  string workflow_id = 1;
  // Empty: the latest run.
  string run_id = 2;
}

// StepRunStatus is where a step's call is.
enum StepRunStatus {
  STEP_RUN_STATUS_UNSPECIFIED = 0;
  // Never scheduled: skipped by its `when`, or not reached (an earlier
  // step failed, the run is still before it, or was canceled).
  STEP_RUN_STATUS_NOT_RUN = 1;
  // Scheduled, not yet picked up by the target service.
  STEP_RUN_STATUS_SCHEDULED = 2;
  // An attempt is running.
  STEP_RUN_STATUS_STARTED = 3;
  STEP_RUN_STATUS_COMPLETED = 4;
  STEP_RUN_STATUS_FAILED = 5;
  STEP_RUN_STATUS_TIMED_OUT = 6;
  STEP_RUN_STATUS_CANCELED = 7;
}

// BindingStepRun is one call of a run: a step, or the compensation (undo)
// of one.
message BindingStepRun {
  string step = 1;
  // Full activity name: the step's activity, or its undo activity.
  string activity = 2;
  // The call is the step's compensation.
  bool undo = 3;
  // The activity is a workflow (a child workflow of the run).
  bool workflow = 4;
  StepRunStatus status = 5;
  // Of the last attempt that started; 0 before the first.
  int32 attempt = 6;
  google.protobuf.Timestamp scheduled_time = 7;
  google.protobuf.Timestamp started_time = 8;
  google.protobuf.Timestamp close_time = 9;
  // ActivityCall.payload, JSON text.
  string input = 10;
  // ActivityResult.payload, JSON text; empty until completed.
  string output = 11;
  // The failure's message and application error type.
  string error = 12;
  string error_type = 13;
}

message GetBindingRunResponse {
  // The run as WorkflowService.GetRun shows it.
  GetRunResponse run = 1;
  // What ran: the hook, its version (0: an unsaved definition) and
  // whether it is a test run.
  string hook = 2;
  uint64 version = 3;
  bool test = 4;
  // The program's steps in declaration order, then every compensation in
  // the order it was scheduled.
  repeated BindingStepRun steps = 5;
}

message CancelBindingRunRequest {
  // A run of a binding: binding/<hook>/... or test/<hook>/...
  string workflow_id = 1;
  string run_id = 2;
}

message CancelBindingRunResponse {}

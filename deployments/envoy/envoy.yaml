# Envoy bootstrap for platform-in-a-box: the minimum — admin, the node,
# and the xds cluster ADS runs over. Listeners (the public one on 10000),
# routes, clusters and endpoints come from backplane over xDS (ADS, delta;
# platform-design.md §6). Every Envoy gets the same snapshot: id and
# cluster only name it in backplane's log. Until backplane runs, Envoy
# starts empty and keeps retrying the xds cluster; after backplane
# restarts it keeps what it has until the new snapshot arrives.
node:
  id: edge
  cluster: backplane-edge

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

dynamic_resources:
  ads_config:
    api_type: DELTA_GRPC
    transport_api_version: V3
    grpc_services:
      - envoy_grpc: { cluster_name: xds }
  cds_config: { ads: {}, resource_api_version: V3 }
  lds_config: { ads: {}, resource_api_version: V3 }

static_resources:
  clusters:
    - name: xds
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: xds
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: host.docker.internal, port_value: 18000 }
